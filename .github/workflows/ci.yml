# Tests und statische Prüfung der Einzeldatei-Anwendung.
#
# Kein npm install nötig: package.json enthält keine Laufzeit- oder
# Entwicklungsabhängigkeiten. Die Suite nutzt ausschließlich Node-Bordmittel
# (node:test, node:vm).
#
# `npm run check` prüft zusätzlich die READMEs und, falls vorhanden, die lokale
# Projekt-Doku. CHANGELOG.md, PLANUNG.md und COMPACTIONS.md müssen ignoriert
# bleiben; der Check schlägt fehl, wenn eine davon versioniert wird.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test und Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 statt ubuntu-latest: ein unbemerktes Runner-Update
        # soll die Suite nicht rot faerben.
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Statische Prüfung (App und READMEs)
        run: npm run check

      - name: Tests
        run: npm test
