# Test-Gate dieses Repos. Die Vorlage in ~/.agents/references/githooks/
# liest diese Werte.
#
# Pfade, deren Aenderung Lint und Tests ausloest. Die Praefixe entscheiden
# nur, OB geprueft wird, nie WAS: die Testmenge bleibt immer vollstaendig.
# .github steht dabei, damit Workflow-Aenderungen den Gate bereits beim
# Commit triggern; pre-push laeuft ohnehin immer. Die READMEs stehen dabei,
# weil check.mjs sie prueft. Die lokale Doku (CHANGELOG.md, PLANUNG.md,
# COMPACTIONS.md) ist ignoriert und wird nicht committet.
prefixes=prompt-manager.html serve.mjs tests/ scripts/ package.json README.md README_de.md .github .githooks .gitattributes
# Kein Projekt-venv: Node kommt aus dem PATH der Git-Bash.
python=
# check.mjs prueft Syntax, Einzeldatei-Zusagen, Offline-Grenzen und
# ID-/Handler-Verdrahtung. actionlint prueft .github/workflows auf
# Ausdrucks- und Kontextfehler (winget: rhysd.actionlint).
lint=node scripts/check.mjs && actionlint
test=npm test
